name: 每日更新必应壁纸

on:
  schedule:
    # UTC 时间，对应北京时间窗口：00:02 / 06:00 / 12:00 / 15:00
    - cron: '2 16 * * *'   # 北京 00:02
    - cron: '0 22 * * *'   # 北京 06:00
    - cron: '0 4 * * *'    # 北京 12:00
    - cron: '0 7 * * *'    # 北京 15:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bing-wallpaper-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并更新（窗口制重试）
        run: node scripts/update.mjs